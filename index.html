<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Loại Ảnh - Người vs Không Phải Người</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        #preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin: 20px auto;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result.human {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .result.not-human {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .result-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result.human .result-text {
            color: #28a745;
        }

        .result.not-human .result-text {
            color: #dc3545;
        }

        .confidence {
            color: #666;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            text-align: center;
            color: #667eea;
            margin: 10px 0;
            font-weight: 500;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
            border: 1px solid #f5c6cb;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Phân Loại Ảnh AI</h1>
        <p class="subtitle">Nhận diện Người / Không Phải Người</p>
        
        <div class="status" id="status">Đang tải model AI...</div>
        <div class="error" id="error"></div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Nhấp hoặc kéo thả ảnh vào đây</div>
            <div class="upload-hint">Hỗ trợ: JPG, PNG, JPEG</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <img id="preview" alt="Preview">
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">Đang phân tích...</p>
        </div>
        
        <div class="result" id="result">
            <div class="result-text" id="resultText"></div>
            <div class="confidence" id="confidence"></div>
        </div>
        
        <button id="analyzeBtn" style="display: none;">Phân Tích Ảnh</button>
        
        <div class="info">
            💡 <strong>Hướng dẫn:</strong> Upload ảnh của bạn và AI sẽ tự động phân loại xem có phải là ảnh người hay không.
        </div>
    </div>

    <script>
        let model = null;
        let currentImage = null;

        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const preview = document.getElementById('preview');
        const result = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const confidence = document.getElementById('confidence');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        const error = document.getElementById('error');
        const analyzeBtn = document.getElementById('analyzeBtn');

        // Load model
        async function loadModel() {
            try {
                status.textContent = 'Đang tải model AI...';
                // Thay đổi đường dẫn này thành đường dẫn tới file user_classifier.h5 của bạn
                model = await tf.loadLayersModel('user_classifier/model.json');
                status.textContent = '✅ Model đã sẵn sàng! Hãy upload ảnh.';
                status.style.color = '#28a745';
            } catch (err) {
                console.error('Lỗi tải model:', err);
                error.style.display = 'block';
                error.innerHTML = `
                    <strong>⚠️ Không thể tải model!</strong><br>
                    Vui lòng đảm bảo:<br>
                    1. File <code>user_classifier.h5</code> đã được chuyển đổi sang format TensorFlow.js<br>
                    2. Các file model.json và *.bin nằm trong thư mục <code>user_classifier/</code><br>
                    3. Chạy qua local server (không mở trực tiếp file HTML)
                `;
                status.style.display = 'none';
            }
        }

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Handle file
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Vui lòng chọn file ảnh!');
                return;
            }

            error.style.display = 'none';
            const reader = new FileReader();
            
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                result.style.display = 'none';
                currentImage = e.target.result;
                
                // Auto analyze
                if (model) {
                    analyzeImage();
                } else {
                    analyzeBtn.style.display = 'block';
                }
            };
            
            reader.readAsDataURL(file);
        }

        // Analyze button
        analyzeBtn.addEventListener('click', analyzeImage);

        // Analyze image
        async function analyzeImage() {
            if (!model) {
                showError('Model chưa được tải. Vui lòng đợi...');
                return;
            }

            if (!currentImage) {
                showError('Vui lòng chọn ảnh trước!');
                return;
            }

            loading.style.display = 'block';
            result.style.display = 'none';
            analyzeBtn.style.display = 'none';

            try {
                // Tạo image element để xử lý
                const img = new Image();
                img.src = currentImage;
                
                await new Promise((resolve) => {
                    img.onload = resolve;
                });

                // Preprocess image - điều chỉnh size phù hợp với model của bạn
                // Giả sử model được train với input size 224x224
                const tensorImg = tf.browser.fromPixels(img)
                      .resizeNearestNeighbor([150, 150]) // Thay đổi size nếu model của bạn khác
                    .toFloat()
                    .div(255.0) // Normalize về [0, 1]
                    .expandDims(0); // Add batch dimension

                // Predict
                const prediction = await model.predict(tensorImg);
                const score = await prediction.data();
                
                // Giả sử model output là binary classification (0: không phải người, 1: người)
                const isHuman = score[0] > 0.5;
                const confidenceValue = (score[0] * 100).toFixed(2);

                // Display result
                loading.style.display = 'none';
                result.style.display = 'block';
                
                if (isHuman) {
                    result.className = 'result human';
                    resultText.textContent = '👤 Đây là ảnh NGƯỜI';
                    confidence.textContent = `Độ tin cậy: ${confidenceValue}%`;
                } else {
                    result.className = 'result not-human';
                    resultText.textContent = '🚫 KHÔNG phải ảnh người';
                    confidence.textContent = `Độ tin cậy: ${(100 - confidenceValue).toFixed(2)}%`;
                }

                // Cleanup
                tensorImg.dispose();
                prediction.dispose();

            } catch (err) {
                console.error('Lỗi phân tích:', err);
                loading.style.display = 'none';
                showError('Có lỗi xảy ra khi phân tích ảnh: ' + err.message);
            }
        }

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
            setTimeout(() => {
                error.style.display = 'none';
            }, 5000);
        }

        // Load model when page loads
        loadModel();
    </script>
</body>
</html>
